name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: self-hosted
    timeout-minutes: 120
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache
    
    - name: Cache LLVM Build
      uses: actions/cache@v4
      with:
        path: |
          build/x64-debug-linux/llvm
        key: ${{ runner.os }}-llvm-${{ hashFiles('llvm/**') }}
        restore-keys: |
          ${{ runner.os }}-llvm-
    
    - name: Configure CMake
      run: |
        cmake --preset x64-debug-linux
    
    - name: Build
      run: |
        cmake --build build/x64-debug-linux --target vkml-compiler
    
    - name: Build Tests
      run: |
        cmake --build build/x64-debug-linux --target tensor_tests
    
    - name: Run Tests
      run: |
        cd build/x64-debug-linux
        ctest --output-on-failure --verbose
